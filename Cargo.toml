[package]
name = "segue"
version = "0.1.0"
edition = "2024"
authors = ["Segue Contributors"]
description = "Segue algorithms and systems framework"

[dependencies]
inventory = "0.3.24"
iced = "0.14.0"
iced_aw = { version = "0.14.1", default-features = false, features = ["menu"] }

[features]
default = ["tests"]
tests = []

[lib]
test = false
doctest = false

[[bin]]
name = "segue"
path = "src/main.rs"
test = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"

[[test]]
name = "cove_runner"
path = "tests/cove_runner.rs"
harness = false
